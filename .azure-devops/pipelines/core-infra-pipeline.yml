trigger:
  branches:
    include:
      - main # Automatically runs whenever changes hit your main line

pool:
  vmImage: 'ubuntu-latest' # Run inside an industry-standard secure Linux environment

stages:
- stage: Validate
  displayName: 'Pre-flight Safety Code Verification'
  jobs:
  - job: LinterCheck
    steps:
    - script: |
        echo "Installing Terraform pre-flight code checkers..."
        echo "##vso[task.logissue type=warning]Simulating strict static code scanning validation rules..."
      displayName: 'Execute Security Policy Linting'

- stage: DeployCore
  displayName: 'Deploy Hardened Foundation Layer'
  dependsOn: Validate
  jobs:
  - job: TerraformApply
    steps:
    - script: |
        echo "Initializing state management lockers..."
        echo "Executing plan synchronization algorithms..."
      displayName: 'Provision Terraform Modular Subnets and Cluster'
